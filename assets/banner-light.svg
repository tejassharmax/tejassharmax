<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Tejas Sharma</title>
  <desc id="d">Full-stack developer. I build software that cares for people. Co-founder of Osprexon. Creator of Ayusha Health and VoicePal.</desc>
  <defs>
    <radialGradient id="ga" cx="88%" cy="0%" r="60%"><stop offset="0" stop-color="#0F9D8A" stop-opacity="0.16"/><stop offset="1" stop-color="#0F9D8A" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0%" cy="100%" r="55%"><stop offset="0" stop-color="#E8772E" stop-opacity="0.12"/><stop offset="1" stop-color="#E8772E" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0E2A2F" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.25" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="gridmask"><rect x="680" y="40" width="480" height="240" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .trace { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 4.5s cubic-bezier(.6,.05,.3,1) infinite; }
    .dot { animation: pulse 4.5s ease-out infinite; transform-origin: 1124px 178px; }
    @keyframes draw { 0% { stroke-dashoffset: 720; opacity: 1 } 55% { stroke-dashoffset: 0; opacity: 1 } 85% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes pulse { 0%, 50% { transform: scale(0); opacity: 0 } 56% { transform: scale(1.25); opacity: 1 } 64%, 85% { transform: scale(1); opacity: 1 } 100% { transform: scale(1); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; stroke-dashoffset: 0 } .dot { animation: none } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#F6F3EC"/>
    <rect width="1200" height="320" fill="url(#ga)"/>
    <rect width="1200" height="320" fill="url(#gb)"/>
    <rect x="680" y="40" width="480" height="240" fill="url(#grid)" mask="url(#gridmask)"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <line x1="80" y1="96" x2="112" y2="96" stroke="#0F9D8A" stroke-width="2"/>
    <text x="126" y="102" font-size="17" font-weight="600" letter-spacing="4" fill="#0F9D8A">FULL-STACK DEVELOPER · UI/UX DESIGNER · INDIA</text>
    <text x="78" y="172" font-size="64" font-weight="700" letter-spacing="-2" fill="#0E2A2F">Tejas Sharma</text>
    <text x="80" y="220" font-size="27" font-weight="600" letter-spacing="-0.5" fill="#0E2A2F">I build software that <tspan fill="#0F9D8A">cares for people.</tspan></text>
    <text x="80" y="266" font-size="18" font-weight="500" fill="#5B6B6E">Co-founder @ Osprexon  ·  Ayusha Health  ·  VoicePal</text>
  </g>

  <path d="M720 178 H812 q9 -14 18 0 H858 l7 12 l13 -96 l15 124 l11 -40 H952 q18 -30 36 0 H1124" fill="none" stroke="#0F9D8A" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="trace" d="M720 178 H812 q9 -14 18 0 H858 l7 12 l13 -96 l15 124 l11 -40 H952 q18 -30 36 0 H1124" fill="none" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="1124" cy="178" r="7" fill="#E8772E"/>
</svg>
