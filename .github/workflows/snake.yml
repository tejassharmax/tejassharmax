name: Contribution snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#E8772E&color_dots=#ECE7DC,#B7E4DC,#6CC7B8,#2AA897,#0F9D8A
            dist/snake-dark.svg?color_snake=#E8772E&color_dots=#16343A,#0D4A44,#0F6E63,#0F9D8A,#2BC4AE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
